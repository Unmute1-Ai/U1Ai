[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "u1ai-cli"
version = "0.1.0"
description = "U1AI terminal agent: natural-language coding with bounded local tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.scripts]
u1 = "u1cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["u1cli"]
