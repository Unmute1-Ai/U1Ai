name: AEGIS-Q authorization gates
on:
  pull_request:
    paths: ['aegis-q/**', '.github/workflows/aegis-q.yml']
  push:
    paths: ['aegis-q/**', '.github/workflows/aegis-q.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: aegis-q/v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - run: python scripts/authorization_demo.py
