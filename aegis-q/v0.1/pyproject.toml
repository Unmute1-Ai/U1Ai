[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-aegis-q"
version = "0.1.1"
description = "Quantum-resilient embodied security model scaffold for NVIDIA edge systems"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
