[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-companion"
version = "0.1.0"
description = "U1 Adult Companion provider adapter layer: envelope, content-class routing policy, pre-effect gate, receipts (stub/mock providers only)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
